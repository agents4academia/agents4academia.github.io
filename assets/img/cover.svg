<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Navy poster: an open book drawn in cream lines beneath a radiant gold spark, linked to symbols of research — a magnifying glass, a flask, a chart, and a manuscript — among scattered stars">
  <style>
    .bg { fill: #002147; }
    .cream { fill: none; stroke: #faf7f0; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .cthin { fill: none; stroke: #faf7f0; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .ring { fill: none; stroke: #24436b; stroke-width: 1.5; }
    .link { fill: none; stroke: #6d80a0; stroke-width: 1.6; stroke-linecap: round; }
    .node { fill: #002147; stroke: #faf7f0; stroke-width: 3; }
    .gold { fill: none; stroke: #c9a14a; stroke-width: 2.5; stroke-linecap: round; }
    .gdot { fill: #c9a14a; }
    .cdot { fill: #faf7f0; }
  </style>

  <rect class="bg" x="0" y="0" width="1200" height="320" rx="6"/>

  <!-- faint rings radiating from the spark -->
  <circle class="ring" cx="600" cy="96" r="120"/>
  <circle class="ring" cx="600" cy="96" r="200" stroke-dasharray="1 9"/>
  <circle class="ring" cx="600" cy="96" r="290"/>

  <!-- ===== links ===== -->
  <line class="link" x1="600" y1="142" x2="600" y2="196"/>
  <line class="link" x1="568" y1="124" x2="448" y2="103"/>
  <line class="link" x1="632" y1="124" x2="752" y2="103"/>
  <line class="link" x1="380" y1="106" x2="259" y2="143"/>
  <line class="link" x1="820" y1="106" x2="941" y2="143"/>
  <line class="link" x1="234" y1="190" x2="480" y2="234"/>
  <line class="link" x1="966" y1="190" x2="720" y2="234"/>
  <!-- gold waypoints -->
  <circle class="gdot" cx="508" cy="113" r="3.5"/>
  <circle class="gdot" cx="692" cy="113" r="3.5"/>
  <circle class="gdot" cx="320" cy="124" r="3.5"/>
  <circle class="gdot" cx="880" cy="124" r="3.5"/>
  <circle class="gdot" cx="600" cy="170" r="3.5"/>
  <circle class="gdot" cx="356" cy="212" r="3.5"/>
  <circle class="gdot" cx="844" cy="212" r="3.5"/>

  <!-- ===== the spark: gold starburst at the heart ===== -->
  <circle class="gold" cx="600" cy="96" r="46" stroke-dasharray="2 10" stroke-width="2"/>
  <path class="gold" d="M600 66 V126 M570 96 H630 M579 75 L621 117 M621 75 L579 117"/>
  <!-- rays -->
  <path class="gold" stroke-width="2" d="M600 36 V22 M600 156 V170 M540 96 H526 M660 96 H674 M558 54 L548 44 M642 54 L652 44 M558 138 L548 148 M642 138 L652 148"/>

  <!-- ===== research nodes ===== -->
  <!-- literature: magnifying glass -->
  <circle class="node" cx="220" cy="158" r="38"/>
  <circle class="cthin" cx="213" cy="151" r="13"/>
  <line class="cthin" x1="222" y1="160" x2="238" y2="176"/>

  <!-- experiment: flask -->
  <circle class="node" cx="414" cy="98" r="36"/>
  <path class="cthin" d="M408 76 v14 l-13 22 a4.5 4.5 0 0 0 3.5 7 h31 a4.5 4.5 0 0 0 3.5-7 l-13-22 v-14"/>
  <line class="cthin" x1="403" y1="76" x2="425" y2="76"/>
  <line class="cthin" x1="400" y1="103" x2="428" y2="103"/>

  <!-- analysis: chart -->
  <circle class="node" cx="786" cy="98" r="36"/>
  <path class="cthin" d="M771 81 v34 h31"/>
  <path class="cthin" d="M776 105 l10-11 7 6 12-16"/>

  <!-- writing: manuscript -->
  <circle class="node" cx="980" cy="158" r="38"/>
  <path class="cthin" d="M965 140 h21 l9 9 v27 h-30 z M986 140 v9 h9"/>
  <path class="cthin" d="M971 158 h18 M971 167 h18"/>

  <!-- ===== open book, large, cream ===== -->
  <line class="cream" x1="600" y1="200" x2="600" y2="278"/>
  <path class="cream" d="M600 216 C556 200 500 196 456 207 L456 270 C500 259 556 263 600 278"/>
  <path class="cream" d="M600 216 C644 200 700 196 744 207 L744 270 C700 259 644 263 600 278"/>
  <path class="cthin" d="M600 225 C560 211 512 207 472 215"/>
  <path class="cthin" d="M600 225 C640 211 688 207 728 215"/>
  <path class="cthin" d="M498 231 C534 224 568 226 588 233"/>
  <path class="cthin" d="M498 244 C534 237 568 239 588 246"/>
  <path class="cthin" d="M612 233 C632 226 666 224 702 231"/>
  <path class="cthin" d="M612 246 C632 239 666 237 702 244"/>
  <path class="cream" d="M456 270 L456 279 C500 268 556 272 600 287 C644 272 700 268 744 279 L744 270"/>
  <!-- gold ribbon -->
  <path class="gold" stroke-width="2" d="M593 283 L588 306 L599 297 L610 308 L605 284"/>

  <!-- ===== scattered stars ===== -->
  <circle class="cdot" cx="96" cy="70" r="2.6"/>
  <circle class="gdot" cx="146" cy="234" r="2.8"/>
  <circle class="cdot" cx="84" cy="170" r="2"/>
  <circle class="gdot" cx="300" cy="44" r="2.8"/>
  <circle class="cdot" cx="480" cy="30" r="2.6"/>
  <circle class="cdot" cx="720" cy="30" r="2.6"/>
  <circle class="gdot" cx="900" cy="44" r="2.8"/>
  <circle class="cdot" cx="1104" cy="70" r="2.6"/>
  <circle class="gdot" cx="1054" cy="234" r="2.8"/>
  <circle class="cdot" cx="1116" cy="170" r="2"/>
  <circle class="cdot" cx="260" cy="262" r="2"/>
  <circle class="cdot" cx="940" cy="262" r="2"/>
  <!-- four-point sparkles -->
  <path class="gold" stroke-width="2" d="M150 116 v14 M143 123 h14"/>
  <path class="gold" stroke-width="2" d="M1050 116 v14 M1043 123 h14"/>
  <path class="cthin" d="M340 280 v12 M334 286 h12"/>
  <path class="cthin" d="M860 280 v12 M854 286 h12"/>
</svg>
