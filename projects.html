<main>
  <div class="wrap">
    <h1>Projects</h1>
    <p class="tagline">
      All our code lives in the
      <a href="https://github.com/Agents4Academia-AI">Agents4Academia-AI</a>
      GitHub organisation — one repository per project. The list below updates
      automatically.
    </p>

    <ul class="plain resources projects" id="repo-list">
      <li class="tba" id="repo-status">Loading repositories&hellip;</li>
    </ul>
  </div>
</main>

<script>
(function () {
  var ORG = "Agents4Academia-AI";
  var EXCLUDE = [".github", "agents4academia.github.io", "media", "example-agents"];
  // Contributors hidden by squashed history etc. — shown in addition to the API list.
  var EXTRA_CONTRIBUTORS = { "prior": ["harit7"] };
  var list = document.getElementById("repo-list");
  var status = document.getElementById("repo-status");

  function fail() {
    status.innerHTML =
      'Could not load the repository list right now (GitHub API limit). ' +
      'Browse it directly at ' +
      '<a href="https://github.com/' + ORG + '">github.com/' + ORG + '</a> ' +
      'or try again in a few minutes.';
  }

  // GitHub allows 60 unauthenticated requests/hour per IP, so cache
  // responses for 10 minutes and serve stale data if the API refuses.
  function getJSON(url) {
    var key = "gh:" + url;
    var hit = null;
    try { hit = JSON.parse(localStorage.getItem(key)); } catch (e) {}
    if (hit && Date.now() - hit.t < 600000) return Promise.resolve(hit.d);
    return fetch(url)
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) {
        try { localStorage.setItem(key, JSON.stringify({ t: Date.now(), d: d })); } catch (e) {}
        return d;
      })
      .catch(function (e) {
        if (hit) return hit.d;
        throw e;
      });
  }

  function repoItem(repo) {
    var li = document.createElement("li");

    var link = document.createElement("a");
    link.href = repo.html_url;
    link.textContent = repo.name;
    li.appendChild(link);

    var meta = [];
    if (repo.language) meta.push(repo.language);
    if (repo.stargazers_count > 0) meta.push("★ " + repo.stargazers_count);
    if (repo.pushed_at) {
      meta.push("updated " + new Date(repo.pushed_at).toLocaleDateString("en-GB",
        { day: "numeric", month: "short" }));
    }
    if (meta.length) {
      var src = document.createElement("span");
      src.className = "src";
      src.textContent = meta.join(" · ");
      li.appendChild(src);
    }

    if (repo.description) {
      var blurb = document.createElement("p");
      blurb.className = "blurb";
      blurb.textContent = repo.description;
      li.appendChild(blurb);
    }

    addContributors(repo, li);
    return li;
  }

  function addContributors(repo, li) {
    getJSON("https://api.github.com/repos/" + ORG + "/" + repo.name +
            "/contributors?per_page=12")
      .then(function (people) {
        people = people.filter(function (p) { return p.type === "User"; });
        (EXTRA_CONTRIBUTORS[repo.name] || []).forEach(function (login) {
          var listed = people.some(function (p) { return p.login === login; });
          if (!listed) {
            people.push({
              login: login,
              html_url: "https://github.com/" + login,
              avatar_url: "https://avatars.githubusercontent.com/" + login + "?v=4"
            });
          }
        });
        if (people.length === 0) return;

        var row = document.createElement("p");
        row.className = "contribs";
        people.forEach(function (p) {
          var a = document.createElement("a");
          a.href = p.html_url;
          a.title = p.login;
          var img = document.createElement("img");
          img.src = p.avatar_url + "&s=64";
          img.alt = p.login;
          img.loading = "lazy";
          a.appendChild(img);
          row.appendChild(a);
        });
        li.appendChild(row);
      })
      .catch(function () { /* contributors are optional */ });
  }

  getJSON("https://api.github.com/orgs/" + ORG + "/repos?per_page=100&sort=pushed")
    .then(function (repos) {
      repos = repos.filter(function (r) {
        return EXCLUDE.indexOf(r.name) === -1 && !r.fork && !r.archived;
      });
      if (repos.length === 0) {
        status.textContent =
          "Project repositories will appear here as teams create them.";
        return;
      }
      list.innerHTML = "";
      repos.forEach(function (r) { list.appendChild(repoItem(r)); });
    })
    .catch(fail);
})();
</script>

</body>
